<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Dry Oar Rafting</title>
    <meta name="description" content="Contact Dry Oar Rafting for reservations, questions, or river trip planning details.">
    <meta name="author" content="Rafael Santos Nascimento da Silva">
    <link rel="stylesheet" href="styles/rafting.css">
</head>
<body>

    <header>
        <img src="images/sua-logo.png" alt="Dry Oar Rafting Logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>
        <div class="hero">
            <h1>Contact Us</h1>
        </div>

        <section class="contact-grid">
            <div class="company-info">
                <h2>Get In Touch</h2>
                <address>
                    Dry Oar Rafting<br>
                    123 River Road<br>
                    Grand Canyon, AZ 86023<br><br>
                    Phone: <a href="tel:5555555555">555-555-5555</a><br>
                    Email: <a href="mailto:info@dryoarrafting.com">info@dryoarrafting.com</a>
                </address>
                <div class="map-container">
                    <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d51691.87427847352!2d-112.16212457814043!3d36.05432650893356!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x873312ae759b4d15%3A0x1f38a9bec99120f9!2sGrand%20Canyon%20Village%2C%20AZ%2086023!5e0!3m2!1sen!2sus!4v1716300000000!5m2!1sen!2sus" width="600" height="450" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
                </div>
            </div>

            <form action="#" method="get" class="contact-form">
                <h2>Send Us a Message</h2>
                
                <label for="name">Name:</label>
                <input type="text" id="name" name="user_name" required>

                <label for="email">Email:</label>
                <input type="email" id="email" name="user_email" required>

                <fieldset>
                    <legend>Purpose of Message</legend>
                    <label class="radio-label">
                        <input type="radio" id="purpose_general" name="purpose" value="general" checked> General Inquiry
                    </label>
                    <label class="radio-label">
                        <input type="radio" id="purpose_reservation" name="purpose" value="reservation"> Reservation Question
                    </label>
                    <label class="radio-label">
                        <input type="radio" id="purpose_suggestion" name="purpose" value="suggestion"> Website Suggestion
                    </label>
                </fieldset>

                <label for="message">Message:</label>
                <textarea id="message" name="user_message" rows="5" required></textarea>

                <label class="checkbox-label">
                    <input type="checkbox" id="newsletter" name="newsletter" value="yes"> Please subscribe me to the monthly newsletter
                </label>

                <button type="submit">Send Message</button>
            </form>
        </section>

        <section class="employees">
            <h2>Meet the Team</h2>
            <div class="employee-gallery">
                <figure>
                    <img src="images/employee1.png" alt="Photo of Guide Jane">
                    <figcaption>Jane Doe - Senior Guide</figcaption>
                </figure>
                <figure>
                    <img src="images/employee2.png" alt="Photo of Manager John">
                    <figcaption>John Smith - Operations Manager</figcaption>
                </figure>
                <figure>
                    <img src="images/employee3.png" alt="Photo of Guide Alex">
                    <figcaption>Alex Johnson - Safety Expert</figcaption>
                </figure>
            </div>
        </section>
    </main>

    <footer>
        <p>© 2025 | Dry Oar Rafting | Rafael Santos Nascimento da Silva</p>
        <nav class="socialmedia">
            <a href="https://facebook.com" target="_blank">
                <img src="images/facebook-icon.svg" alt="Facebook Icon">
            </a>
            <a href="https://linkedin.com" target="_blank">
                <img src="images/linkedin-icon.svg" alt="LinkedIn Icon">
            </a>
            <a href="https://instagram.com" target="_blank">
                <img src="images/instagram-icon.svg" alt="Instagram Icon">
            </a>
        </nav>
    </footer>

</body>
</html>
